[project]
name = "pytbak"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires the Docker stack running at localhost:8000",
]

[tool.black]
line-length = 120
target-version = ["py311"]
