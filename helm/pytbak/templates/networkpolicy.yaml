{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pytbak.fullname" . }}
  labels:
    {{- include "pytbak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pytbak.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
      from:
        - namespaceSelector: {}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # OTLP (Datadog Agent)
    - ports:
        - port: 4317
          protocol: TCP
    # Webdis HTTP
    - ports:
        - port: 7379
          protocol: TCP
    # HTTP/HTTPS (debug endpoints: curl, tcp-check, ping)
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
{{- end }}
