apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pytbak.fullname" . }}-config
  labels:
    {{- include "pytbak.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.redis.url }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.postgresql.url }}
  DATABASE_URL: {{ .Values.postgresql.url | quote }}
  {{- end }}
  {{- if .Values.webdis.url }}
  WEBDIS_URL: {{ .Values.webdis.url | quote }}
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- end }}
