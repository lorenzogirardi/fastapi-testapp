name: Security Review

# On-demand LLM static security review (tools/run_review.py).
# Reads a codebase, selects relevant skills from the Anthropic Cybersecurity
# Skills library, applies each to the source, uploads a ranked Markdown report.

on:
  workflow_dispatch:
    inputs:
      project_repo:
        description: "Target repo owner/name (blank = this repo)"
        required: false
        default: ""
      project_ref:
        description: "Target ref/branch/tag"
        required: false
        default: ""
      max_skills:
        description: "Max skills to select and apply"
        required: false
        default: "50"
      smart_select:
        description: "Phase-1 LLM skill selection (false = keyword fallback only)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.inputs.project_repo || github.repository }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tooling (this repo)
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout target (this repo)
        if: inputs.project_repo == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.project_ref || github.ref }}
          path: target

      - name: Checkout target (external repo)
        if: inputs.project_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project_repo }}
          ref: ${{ inputs.project_ref }}
          token: ${{ secrets.GH_PAT }}
          path: target

      - name: Clone skills library
        run: git clone --depth 1 https://github.com/mukul975/Anthropic-Cybersecurity-Skills skills-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run security review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          SMART=""
          if [ "${{ inputs.smart_select }}" != "true" ]; then SMART="--no-smart-select"; fi
          python3 tooling/tools/run_review.py \
            --project     target \
            --skills-dir   skills-lib \
            --provider     openrouter \
            --max-skills   "${{ inputs.max_skills }}" \
            --output       "$GITHUB_WORKSPACE/security-review.md" \
            $SMART

      - name: Job summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/security-review.md" ]; then
            cat "$GITHUB_WORKSPACE/security-review.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — see the run logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review
          path: security-review.md
          if-no-files-found: warn
          retention-days: 90
