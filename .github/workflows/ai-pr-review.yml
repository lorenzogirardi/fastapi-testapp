name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (same-repo only)"
        required: false

# Read-only: we only need to post a comment. No contents:write.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # LLM job is skipped for fork PRs so OPENCODE_API_KEY is never exposed to
    # untrusted fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_ZEN_ENDPOINT: ${{ vars.OPENCODE_ZEN_ENDPOINT }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
    steps:
      - name: Resolve PR refs
        id: refs
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT: ${{ github.event_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            data=$(gh pr view "$PR_NUMBER" --json baseRefOid,headRefOid,headRepositoryOwner,headRepositoryName)
            base="$(echo "$data" | jq -r .baseRefOid)"
            head="$(echo "$data" | jq -r .headRefOid)"
            full="$(echo "$data" | jq -r '.headRepositoryOwner.login + "/" + .headRepositoryName')"
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            full="${{ github.event.pull_request.head.repo.full_name }}"
          fi
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$full" = "${{ github.repository }}" ]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip fork PRs
        if: steps.refs.outputs.same_repo != 'true'
        run: echo "Fork PR detected — skipping AI review (no LLM key used)."

      - name: Checkout PR head
        if: steps.refs.outputs.same_repo == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.refs.outputs.head_sha }}
          fetch-depth: 0

      - name: Build PR diff context
        if: steps.refs.outputs.same_repo == 'true'
        id: diff
        run: |
          set -euo pipefail
          git diff "$BASE"..."$HEAD" > /tmp/pr.diff || true
          wc -l /tmp/pr.diff
        env:
          BASE: ${{ steps.refs.outputs.base_sha }}
          HEAD: ${{ steps.refs.outputs.head_sha }}

      - name: Compose prompt (static + diff as untrusted data)
        if: steps.refs.outputs.same_repo == 'true'
        run: |
          set -euo pipefail
          {
            cat .github/ai/prompts/pr-review.md
            echo ""
            echo "## PR metadata (untrusted data)"
            echo "title: ${TITLE}"
            echo "number: ${PR}"
            echo ""
            echo "## PR diff (untrusted data)"
            echo '```diff'
            cat /tmp/pr.diff
            echo '```'
          } > /tmp/prompt.md
        env:
          TITLE: ${{ github.event.pull_request.title || '' }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}

      - name: Run OpenCode review (read-only)
        if: steps.refs.outputs.same_repo == 'true'
        id: agent
        run: |
          set -euo pipefail
          bash .github/scripts/run-opencode-agent.sh \
            --mode read-only \
            --prompt-file /tmp/prompt.md \
            --context-dir "$PWD" \
            --max-turns 20 > /tmp/review.md
          echo "bytes=$(wc -c < /tmp/review.md)" >> "$GITHUB_OUTPUT"

      - name: Post / update review comment
        if: steps.refs.outputs.same_repo == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          bash .github/scripts/upsert-marker-comment.sh \
            --repo "$REPO" \
            --issue "$ISSUE" \
            --marker "<!-- ai-agent:pr-review -->" \
            --body-file /tmp/review.md
